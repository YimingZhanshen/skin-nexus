name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Format
        # The gate is only meaningful because .gitattributes pins *.go to LF on
        # checkout — otherwise a CRLF working copy reports false positives.
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: Test and coverage floor
        # One run does both jobs: the suite must pass, and its coverage must not
        # slide. The number is a ratchet, not a target — 48.7% measured
        # 2026-11-05 against the 45.0 floor in server/testdata/coverage-floor.txt.
        # The second half is the part that actually pays: a package losing its
        # last test shows up there even when the total barely moves.
        run: |
          if ! go test ./... -coverprofile=coverage.out > coverage.txt 2>&1; then
            cat coverage.txt
            exit 1
          fi
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          floor=$(awk '/^total/ {print $2}' testdata/coverage-floor.txt)
          echo "total=${total}% floor=${floor}%"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t+0 >= f+0) }' || { echo "coverage fell below the floor"; exit 1; }
          awk '/coverage: 0\.0% of statements|\[no test files\]/ {for (i = 1; i <= NF; i++) if ($i ~ /^skin-nexus\//) print $i}' coverage.txt \
            | sed 's|skin-nexus/server/||' | sort > zero-got.txt
          awk '/^zero-allowed/ {print $2}' testdata/coverage-floor.txt | sort > zero-want.txt
          diff -u zero-want.txt zero-got.txt || { echo "the set of 0%-covered packages changed"; exit 1; }
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: server/coverage.out
          if-no-files-found: ignore
          retention-days: 7
      - name: Test plugin tooling
        run: go test ./cmd/skin-plugin/... ./internal/marketfmt/... ./internal/signedpkg/...

  # MySQL round-trip suite over the full migration tree (build tag `integration`).
  # 5.7 + 8.0 matrix: two production incidents were 5.7-only SQL issues that
  # the 8.0-only suite could not catch (login COLLATE / prepared 1267).
  # ./internal/account/ rides along on every engine leg: its reused-name test is
  # the only automated guard on 铁律 2 (a renamed-away name still owns its
  # OfflineUUID), and it is engine-agnostic — dbx.IsDupKey classifies the
  # collision for MySQL/MariaDB/PostgreSQL/SQLite alike.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        mysql: ['8.0', '5.7']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skin_nexus_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: server
    env:
      SKIN_TEST_DSN: 'root:root@tcp(127.0.0.1:3306)/skin_nexus_test?parseTime=true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Integration test
        run: go test -p 1 -tags integration ./internal/store/ ./internal/account/ # -p 1: the two suites share one database, and the store suite drops every table before migrating

  # The same suite against the other engines the store now claims to speak.
  # MariaDB is on the MySQL wire, so it is the cheap way to catch a statement
  # that MySQL accepted only because of its own extensions; PostgreSQL and
  # SQLite exercise dialect/dbx for real. MySQL-only fixtures skip themselves
  # with a reason rather than passing quietly (see
  # server/internal/store/engine_gate_integration_test.go).
  integration-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        mariadb: ['11.4', '10.11']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: skin_nexus_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: server
    env:
      SKIN_TEST_DSN: 'root:root@tcp(127.0.0.1:3306)/skin_nexus_test?parseTime=true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Integration test
        run: go test -p 1 -tags integration ./internal/store/ ./internal/account/ # -p 1: the two suites share one database, and the store suite drops every table before migrating

  integration-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: postgres
            dsn: 'postgres://skin:skin@127.0.0.1:5432/skin_nexus_test?sslmode=disable'
          - label: sqlite
            dsn: 'sqlite:/tmp/skin-nexus-test/engine.db'
    name: integration (${{ matrix.label }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skin
          POSTGRES_PASSWORD: skin
          POSTGRES_DB: skin_nexus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U skin -d skin_nexus_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: server
    env:
      SKIN_TEST_DSN: ${{ matrix.dsn }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum
      - name: Integration test
        # The SQLite leg starts from an empty file every run; the PostgreSQL
        # service is also up for that leg and simply goes unused.
        run: |
          rm -rf /tmp/skin-nexus-test && mkdir -p /tmp/skin-nexus-test
          # -p 1: the two suites share one database, and the store suite drops
          # every table before migrating — in parallel they corrupt each other.
          go test -p 1 -tags integration ./internal/store/ ./internal/account/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Locale and error-code parity
        # From the repo root: the gate reads web/src/locales and the Go code
        # catalogue together, so a backend code cannot gain a caller before the
        # dictionaries know it.
        run: node ../scripts/check-locales.mjs
      - name: Build
        run: npm run build
      - name: Dependency audit
        # The line used to be critical-only to defer four `high` advisories that
        # needed a vue-i18n 9→11 upgrade. That upgrade shipped (package.json pins
        # ^11.4.16) and `npm audit --audit-level=low` now reports 0 vulnerabilities,
        # so the deferral has no subject left: high and critical block, and the
        # summary step below still surfaces everything lower without blocking.
        run: npm audit --audit-level=high
      - name: Advisory audit summary
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=low >> "$GITHUB_STEP_SUMMARY"

  # Static analysis over the two surfaces that handle untrusted input: the Go
  # API (SSR-built JSON, UGC rendering, path joins) and the SPA. Alerts land in
  # the security tab as a review queue — this is not a release gate yet, because
  # the baseline has never been triaged and a green-to-red switch on first run
  # would only teach people to ignore it.
  codesql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go, javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  # Docs are operational promises: an env table an operator copy-pastes from, a
  # compatibility matrix that says what works. Cheap enough to run on its own so
  # a prose-only branch still gets the signal.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Links, tables, snapshot dating, env truth
        run: node scripts/check-docs.mjs

  # Workflow hygiene: this repo's actions push images with GITHUB_TOKEN and gate
  # market signing behind environments, so template injection into an action input
  # and unpinned third-party actions are worth a standing report. Non-blocking
  # until its findings are triaged.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install
        # Pinned: a silent upgrade that starts flagging new issue classes would
        # turn an advisory job into noise nobody reads.
        run: |
          pipx install zizmor==1.31.1 || python -m pip install --user --break-system-packages zizmor==1.31.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Audit workflows
        run: zizmor --format plain .github/workflows/ | tee -a "$GITHUB_STEP_SUMMARY"

  # PR leg for the same Dockerfile: prove the multi-stage build still compiles
  # before merge. No registry login, no push, no tags, no registry cache — a PR
  # (including one from a fork, whose GITHUB_TOKEN is read-only) must never be
  # able to move :latest or write a cache blob. Without this leg a broken
  # Dockerfile is only discovered after it lands on main.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no push)
        # GOPROXY override matches the push job: goproxy.cn is the local-build
        # default and is slow/unreliable from GitHub's US runners.
        run: |
          docker build --pull \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg BUILD_COMMIT=${{ github.sha }} \
            -t skin-nexus:pr .

  # Build the production image (multi-stage Dockerfile) and push to GHCR
  # (:latest + :sha-*). Deploy hosts pull ghcr.io directly.
  # Push on `push` events only — PR builds must never touch :latest.
  docker:
    runs-on: ubuntu-latest
    # A stalled registry/blob fetch must fail the job, not hang for hours.
    timeout-minutes: 20
    if: github.event_name == 'push'
    permissions:
      packages: write   # ghcr push
    steps:
      - uses: actions/checkout@v7
      # image names must be lowercase; github.repository keeps the owner's case
      - name: Resolve lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Refetch the base images every build. Without this the buildx cache
          # can serve a stale golang/node/alpine layer, and "rebuild = patched"
          # stops being true — the whole point of shipping a floating builder.
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # GitHub's US runners reach proxy.golang.org directly; goproxy.cn is
          # only the local-build default.
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            BUILD_VERSION=0.5.0
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.run_started_at }}
            BUILD_BRANCH=${{ github.ref_name }}
          # Registry cache lives next to the image in GHCR and is not subject
          # to the 10 GB Actions-cache eviction that dropped the go mod layer
          # on 2026-10-31 (a 4.3 kB blob then stalled for 370s). Keep GHA as a
          # read-only fallback for older caches.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
