# One-command quick start: no file editing required.
#
#   cat > .env <<EOF
#   SKIN_BASE_URL=https://skin.example.com
#   SKIN_DB_PASSWORD=$(openssl rand -hex 16)
#   SKIN_DB_ROOT_PASSWORD=$(openssl rand -hex 16)
#   SKIN_ADMIN_TOKEN=$(openssl rand -hex 32)
#   SKIN_SETUP_TOKEN=$(openssl rand -hex 16)
#   EOF
#   docker compose -f docker-compose.quickstart.yml up -d
#
# This file is the zero-edit variant of docker-compose.yml: every required
# value comes from .env or the shell. A key listed here is the only key that
# reaches the container — compose reads .env to interpolate this file, it does
# not hand the whole file to the service — so a variable that is documented but
# missing below silently does nothing. SKIN_SETUP_TOKEN is the install-wizard
# token /setup asks for; leaving it unset falls back to a fresh random value
# printed on the boot log line every time the site is still uninitialised.
# For external MySQL, pinned images, reverse-proxy notes and backups, use
# docker-compose.yml and docs/deploy.md.

services:
  skin-nexus:
    image: ghcr.io/yimingzhanshen/skin-nexus:${SKIN_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${SKIN_PORT:-8080}:8080'
    environment:
      SKIN_LISTEN: ':8080'
      SKIN_BASE_URL: '${SKIN_BASE_URL:?set SKIN_BASE_URL in .env}'
      SKIN_ENV: '${SKIN_ENV:-production}'
      SKIN_DATABASE_DSN: 'skin:${SKIN_DB_PASSWORD:?set SKIN_DB_PASSWORD in .env}@tcp(db:3306)/skin_nexus?parseTime=true&charset=utf8mb4'
      SKIN_DATA_DIR: /data
      SKIN_AUTO_MIGRATE: 'true'
      SKIN_ADMIN_TOKEN: '${SKIN_ADMIN_TOKEN:?set SKIN_ADMIN_TOKEN in .env}'
      SKIN_SETUP_TOKEN: '${SKIN_SETUP_TOKEN:-}'
      # Third-party analytics hosts the CSP must let through. Empty keeps the
      # shipped policy byte for byte. .env only interpolates: a variable that
      # is not listed here never reaches the container.
      SKIN_CSP_SCRIPT_EXTRA_SOURCES: '${SKIN_CSP_SCRIPT_EXTRA_SOURCES:-}'
      SKIN_CSP_CONNECT_EXTRA_SOURCES: '${SKIN_CSP_CONNECT_EXTRA_SOURCES:-}'
      SKIN_PLUGIN_MARKET_URL: '${SKIN_PLUGIN_MARKET_URL:-https://yimingzhanshen.github.io/skin-nexus-plugins/v1/registry.json}'
      SKIN_PLUGIN_TRUST_KEYS: '${SKIN_PLUGIN_TRUST_KEYS:-market-2026-10:ID2EWgcfs1E4UbGCCX9WjD0aCgTof3oeuHV03IpdGNY=}'
      SKIN_THEME_MARKET_URL: '${SKIN_THEME_MARKET_URL:-https://yimingzhanshen.github.io/skin-nexus-plugins/themes/v1/registry.json}'
      SKIN_THEME_TRUST_KEYS: '${SKIN_THEME_TRUST_KEYS:-theme-market-2026-11:EXxNehbsxNG9gdYUztMl/EU/lZ09+fPftPvmjeqPr/I=}'
      # SKIN_METRICS: 'true'                        # expose GET /metrics (off by default: it publishes route counts)
    volumes:
      - skin-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: skin_nexus
      MYSQL_USER: skin
      MYSQL_PASSWORD: '${SKIN_DB_PASSWORD:?set SKIN_DB_PASSWORD in .env}'
      MYSQL_ROOT_PASSWORD: '${SKIN_DB_ROOT_PASSWORD:?set SKIN_DB_ROOT_PASSWORD in .env}'
    volumes:
      - skin-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  skin-data: {}
  skin-db: {}
