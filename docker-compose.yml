# SkinNexus docker compose deployment (recommended path).
#
# Image source: GitHub Actions builds the production image on every push to
# main and publishes it to GHCR — deployment hosts only pull, never build.
#   image: ghcr.io/yimingzhanshen/skin-nexus:${SKIN_IMAGE_TAG:-latest}
# Pin a version with :sha-<commit> for reproducible upgrades / easy rollback.
# Offline / air-gapped: switch back to `build: .` and run `up -d --build`.
#
# Two database modes (same file):
#   1. bundled MySQL  — keep the `db` service as-is (default below)
#   2. external MySQL — comment out the `db` service and `depends_on`, point
#      SKIN_DATABASE_DSN at your server (legacy blessing DB / migrated DB /
#      fresh empty DB all work; empty DB auto-initializes with
#      SKIN_AUTO_MIGRATE=true, then the /setup wizard completes install).
#      Reaching a MySQL on the same host (e.g. port 3306 on the host) needs
#      `network_mode: host` (drop the `ports:` block) or the docker bridge IP
#      (172.17.0.1) in the DSN.
#
# Data persists in the named volumes (skin-data + skin-db). Image upgrades
# replace only the container — volumes survive. Back up both volumes
# (sign-key.pem inside skin-data: losing it invalidates every skin signature).
#
# Full handbook: docs/deploy.md

services:
  skin-nexus:
    image: ghcr.io/yimingzhanshen/skin-nexus:${SKIN_IMAGE_TAG:-latest}
    # build: .                                            # source-build alternative
    pull_policy: always
    restart: unless-stopped
    ports:
      # behind a reverse proxy, bind to loopback only: '127.0.0.1:8080:8080'
      - '8080:8080'
    environment:
      SKIN_LISTEN: ':8080'
      SKIN_BASE_URL: https://skin.example.com      # <- your public URL (set BEFORE first start: texture URLs + OIDC issuer snapshot it)
      SKIN_ENV: '${SKIN_ENV:-production}'           # optional label shown on 管理 → 运行状态 (production/demo/...)
      SKIN_DATABASE_DSN: 'skin:CHANGE_ME@tcp(db:3306)/skin_nexus?parseTime=true&charset=utf8mb4'   # <- CHANGE_ME must equal MYSQL_PASSWORD below
      SKIN_DATA_DIR: /data                          # textures/keys/themes root
      SKIN_AUTO_MIGRATE: 'true'                     # empty DB -> apply migrations/
      SKIN_ADMIN_TOKEN: CHANGE_ME                   # openssl rand -hex 32 (machine/API fallback)
      # optional modules (default off):
      # SKIN_OIDC_ENABLED: 'true'                   # launcher passwordless login (yggc/OIDC)
      # Signed plugin market defaults to the upstream registry; override both
      # values for a fork, or set SKIN_PLUGIN_MARKET_URL='' to disable it.
      SKIN_PLUGIN_MARKET_URL: '${SKIN_PLUGIN_MARKET_URL:-https://yimingzhanshen.github.io/skin-nexus-plugins/v1/registry.json}'
      SKIN_PLUGIN_TRUST_KEYS: '${SKIN_PLUGIN_TRUST_KEYS:-market-2026-10:ID2EWgcfs1E4UbGCCX9WjD0aCgTof3oeuHV03IpdGNY=}'
      # SKIN_PLUGIN_STATE_DIR: '/data/plugins/.state'
      # SKIN_PLUGIN_UPLOAD_MAX: '67108864' 
      # SKIN_UNION_ENABLED: 'false'                 # MUA Union member module (zero surface when off)
      # SKIN_INVITE_REQUIRED: 'true'                # registration requires an invitation code
    volumes:
      - skin-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:                                               # comment out for external MySQL
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: skin_nexus
      MYSQL_USER: skin
      MYSQL_PASSWORD: CHANGE_ME
      MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT
    volumes:
      - skin-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  skin-data: {}    # textures, sign-key.pem, oidc-key.pem, themes/, union keys
  skin-db: {}      # bundled MySQL data (omit when using external DB)
